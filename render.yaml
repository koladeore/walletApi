# Paid, always-on development/test deployment. Review costs before applying.
services:
  - type: web
    name: wallet-api
    runtime: node
    region: frankfurt
    plan: 0.5c-512mb
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm run start:prod
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NODE_ENV
        value: production
      # Keep background jobs in this process for the initial deployment.
      - key: APP_MODE
        value: combined
      - key: DATABASE_URL
        fromDatabase:
          name: wallet-db
          property: connectionString
      - key: REDIS_HOST
        fromService:
          name: wallet-redis
          type: keyvalue
          property: host
      - key: REDIS_PORT
        fromService:
          name: wallet-redis
          type: keyvalue
          property: port
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_SECRET
        generateValue: true
      - key: AUTH_SECURITY_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: REFRESH_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGINS
        value: http://localhost:5173,http://localhost:3001
      - key: AUTH_DELIVERY_MODE
        value: provider
      - key: RESEND_API_KEY
        sync: false
      - key: AUTH_EMAIL_FROM
        sync: false
      - key: PAYSTACK_ENABLED
        value: "true"
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: ENABLE_SIMULATED_FUNDING
        value: "false"
      - key: DB_POOL_MAX
        value: "10"
  - type: keyvalue
    name: wallet-redis
    region: frankfurt
    plan: 256mb
    ipAllowList: []
    maxmemoryPolicy: noeviction

databases:
  - name: wallet-db
    region: frankfurt
    plan: 0.1c-256mb
    databaseName: walletdb
    user: wallet
    ipAllowList: []
