apiVersion: batch/v1
kind: Job
metadata:
  name: wallet-migrate
  namespace: wallet
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300

  template:
    metadata:
      labels:
        app: wallet-migrate

    spec:
      restartPolicy: Never

      containers:
        - name: migrate
          image: wallet-migrate:local
          imagePullPolicy: Never

          command:
            - npx
            - prisma
            - migrate
            - deploy

          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: wallet-secret
                  key: DATABASE_URL

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"