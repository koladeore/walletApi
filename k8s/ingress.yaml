apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wallet-ingress
  namespace: wallet
spec:
  ingressClassName: nginx

  rules:
    - host: wallet.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wallet-api-service
                port:
                  number: 3000