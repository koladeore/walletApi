apiVersion: v1
kind: ConfigMap
metadata:
  name: wallet-config
  namespace: wallet
data:
  NODE_ENV: "production"
  PORT: "3000"

  REDIS_HOST: "redis"
  REDIS_PORT: "6379"

  CORS_ORIGINS: ""
  TRUST_PROXY_IPS: ""

  ENABLE_SIMULATED_FUNDING: "false"

  JWT_EXPIRES_IN: "15m"
  REFRESH_EXPIRES_IN: "7d"

  DB_POOL_MAX: "10"
  DB_CONNECTION_TIMEOUT_MS: "5000"
  DB_IDLE_TIMEOUT_MS: "30000"
  DB_STATEMENT_TIMEOUT_MS: "15000"
  DB_LOCK_TIMEOUT_MS: "5000"

  RATE_LOGIN_IP_LIMIT: "10"
  RATE_LOGIN_ACCOUNT_LIMIT: "5"
  RATE_MONEY_IP_LIMIT: "20"
  RATE_MONEY_ACCOUNT_LIMIT: "10"
  RATE_READ_IP_LIMIT: "120"
  RATE_READ_ACCOUNT_LIMIT: "120"
  RATE_WRITE_IP_LIMIT: "30"
  RATE_WRITE_ACCOUNT_LIMIT: "20"

  LIMIT_BASIC_TRANSACTION_NGN: "50000"
  LIMIT_BASIC_DAILY_NGN: "100000"
  LIMIT_VERIFIED_TRANSACTION_NGN: "100000"
  LIMIT_VERIFIED_DAILY_NGN: "500000"

  PAYSTACK_ENABLED: "false"
  NOTIFICATION_EMAIL_ENABLED: "false"
  AUTH_DELIVERY_MODE: "disabled"