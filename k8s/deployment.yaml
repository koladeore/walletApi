apiVersion: apps/v1
kind: Deployment
metadata:
  name: wallet-api
  namespace: wallet
spec:
  replicas: 1

  selector:
    matchLabels:
      app: wallet-api

  template:
    metadata:
      labels:
        app: wallet-api

    spec:
      containers:
        - name: wallet-api
          image: wallet-api:local
          imagePullPolicy: Never

          ports:
            - containerPort: 3000

          envFrom:
            - configMapRef:
                name: wallet-config
            - secretRef:
                name: wallet-secret

          env:
            - name: APP_MODE
              value: "api"

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          startupProbe:
            httpGet:
              path: /api/v1
              port: 3000
            periodSeconds: 5
            failureThreshold: 24
            timeoutSeconds: 5

          readinessProbe:
            httpGet:
              path: /api/v1
              port: 3000
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /api/v1
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3