name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ESLint uses TypeScript type information. Generate Prisma's types first
      # because a clean GitHub runner does not have node_modules/.prisma yet.
      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/walletdb?schema=public

      - name: Run linter
        run: npm run lint

  test-and-build:
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: walletdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set test environment
        run: |
          echo "NODE_ENV=test" >> "$GITHUB_ENV"
          echo "APP_MODE=combined" >> "$GITHUB_ENV"
          echo "AUTH_DELIVERY_MODE=disabled" >> "$GITHUB_ENV"
          echo "NOTIFICATION_EMAIL_ENABLED=false" >> "$GITHUB_ENV"
          echo "PAYSTACK_ENABLED=false" >> "$GITHUB_ENV"
          echo "DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/walletdb?schema=public" >> "$GITHUB_ENV"
          echo "REDIS_HOST=127.0.0.1" >> "$GITHUB_ENV"
          echo "REDIS_PORT=6379" >> "$GITHUB_ENV"
          echo "JWT_SECRET=test_jwt_secret" >> "$GITHUB_ENV"
          echo "REFRESH_SECRET=test_refresh_secret" >> "$GITHUB_ENV"
          echo "RESEND_API_KEY=" >> "$GITHUB_ENV"

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply Prisma migrations
        run: npx prisma migrate deploy

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test -- --runInBand --no-watchman

  docker-build:
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      ECR_REGISTRY: 284267329100.dkr.ecr.us-east-1.amazonaws.com
      ECR_REPOSITORY: wallet-api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build production Docker image
        run: |
          docker build \
            --target production \
            --tag wallet-api:${{ github.sha }} \
            .

      - name: Verify Docker image
        run: |
          docker image inspect wallet-api:${{ github.sha }} \
            --format='user={{.Config.User}} port={{json .Config.ExposedPorts}} command={{json .Config.Cmd}}'

      - name: Configure temporary AWS credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::284267329100:role/GitHubActionsWalletApiEcrPush
          role-session-name: wallet-api-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: '284267329100'

      - name: Log in to Amazon ECR
        if: github.event_name == 'push'
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login \
                --username AWS \
                --password-stdin "$ECR_REGISTRY"

      - name: Tag and push image to Amazon ECR
        if: github.event_name == 'push'
        run: |
          docker tag \
            wallet-api:${{ github.sha }} \
            "$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"
          docker tag \
            wallet-api:${{ github.sha }} \
            "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
