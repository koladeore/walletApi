name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ESLint uses TypeScript type information. Generate Prisma's types first
      # because a clean GitHub runner does not have node_modules/.prisma yet.
      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/walletdb?schema=public

      - name: Run linter
        run: npm run lint

  test-and-build:
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: walletdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set test environment
        run: |
          {
            echo "NODE_ENV=test"
            echo "APP_MODE=combined"
            echo "AUTH_DELIVERY_MODE=disabled"
            echo "NOTIFICATION_EMAIL_ENABLED=false"
            echo "PAYSTACK_ENABLED=false"
            echo "DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/walletdb?schema=public"
            echo "REDIS_HOST=127.0.0.1"
            echo "REDIS_PORT=6379"
            echo "JWT_SECRET=test_jwt_secret"
            echo "REFRESH_SECRET=test_refresh_secret"
            echo "RESEND_API_KEY="
          } >> "$GITHUB_ENV"

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply Prisma migrations
        run: npx prisma migrate deploy

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test -- --runInBand --no-watchman
  docker-build:
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: koladeore/wallet-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build production Docker image
        run: |
          docker build \
            --target production \
            --tag wallet-api:${{ github.sha }} \
            .

      - name: Verify Docker image
        run: |
          docker image inspect wallet-api:${{ github.sha }} \
            --format='user={{.Config.User}} port={{json .Config.ExposedPorts}} command={{json .Config.Cmd}}'

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push image to GHCR
        if: github.event_name == 'push'
        run: |
          docker tag \
            wallet-api:${{ github.sha }} \
            "$REGISTRY/$IMAGE_NAME:${{ github.sha }}"

          docker tag \
            wallet-api:${{ github.sha }} \
            "$REGISTRY/$IMAGE_NAME:latest"

          docker push "$REGISTRY/$IMAGE_NAME:${{ github.sha }}"
          docker push "$REGISTRY/$IMAGE_NAME:latest"
