name: wallet-api

services:
  postgres:
    image: postgres:15-alpine
    command: ["postgres", "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:-100}"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-walletdb}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: build
    command: npx prisma migrate deploy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-walletdb}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: production
    environment:
      NODE_ENV: production
      ENABLE_SIMULATED_FUNDING: "false"
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-walletdb}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      DB_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS:-5000}
      DB_IDLE_TIMEOUT_MS: ${DB_IDLE_TIMEOUT_MS:-30000}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-15000}
      DB_LOCK_TIMEOUT_MS: ${DB_LOCK_TIMEOUT_MS:-5000}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      REFRESH_SECRET: ${REFRESH_SECRET:?Set REFRESH_SECRET in .env}
      REFRESH_EXPIRES_IN: ${REFRESH_EXPIRES_IN:-7d}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      PAYSTACK_ENABLED: ${PAYSTACK_ENABLED:-false}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      AUTH_SECURITY_SECRET: ${AUTH_SECURITY_SECRET:?Set a distinct AUTH_SECURITY_SECRET in .env}
      LIMIT_BASIC_TRANSACTION_NGN: ${LIMIT_BASIC_TRANSACTION_NGN:-50000}
      LIMIT_BASIC_DAILY_NGN: ${LIMIT_BASIC_DAILY_NGN:-100000}
      LIMIT_VERIFIED_TRANSACTION_NGN: ${LIMIT_VERIFIED_TRANSACTION_NGN:-100000}
      LIMIT_VERIFIED_DAILY_NGN: ${LIMIT_VERIFIED_DAILY_NGN:-500000}
      NOTIFICATION_EMAIL_ENABLED: ${NOTIFICATION_EMAIL_ENABLED:-true}
      AUTH_DELIVERY_MODE: ${AUTH_DELIVERY_MODE:-disabled}
      AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM:-}
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/v1').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
